name: Deploy ForbeCORP to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - id: pages
        uses: actions/configure-pages@v5
      - name: Test and generate the website
        env:
          FORBECORP_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked
          cargo +stable run --locked --release -- build
          test -s dist/index.html
          test -s dist/assets/vendor/pdflib/pdf-lib.min.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
