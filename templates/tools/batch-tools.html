<section class="workspace glass text-workspace" aria-labelledby="work-title" id="batch-work">
  <div class="workspace-heading"><div><h1 id="work-title">{{batchTitle}}</h1><p>{{batchIntro}}</p></div><span class="workspace-label">{{workLocal}}</span></div>
  <div class="tool-detail field-stack">
    <label for="batch-mode" class="editor-label">{{batchOperation}}</label>
    <select id="batch-mode" class="field fit-field" data-job-lock><option value="clean">{{cleanTitle}}</option><option value="extract">{{pdfTextTitle}}</option><option value="pages">{{batchExtractPages}}</option></select>
    <label class="drop-field" data-drop><span>{{chooseDrop}}</span><span class="drop-button" aria-hidden="true">{{workFile}}</span><input id="batch-source" type="file" accept=".txt,.md,.csv,.docx,.odt" data-job-lock multiple aria-describedby="batch-help"></label>
    <p id="batch-help" class="text-tool-note">{{batchMax}}</p>
    <p class="text-tool-note">{{batchUsesSettings}}</p>
    <label for="batch-range" class="editor-label">{{pagesLabel}}</label>
    <input id="batch-range" class="field fit-field" type="text" dir="ltr" placeholder="1–3, 5" aria-describedby="batch-range-help" data-job-lock>
    <p id="batch-range-help" class="text-tool-note">{{pagesHelp}}</p>
    <ul id="batch-list" class="file-list batch-list"></ul>
    <div class="text-tool-actions"><button type="button" id="batch-run" class="btn btn-primary" data-run disabled>{{batchRun}}</button> <button type="button" id="batch-sample" class="btn btn-secondary" data-job-lock data-sample="{{sampleCleanup}}">{{tryExample}}</button> <button type="button" id="batch-download" class="btn btn-secondary" disabled>{{downloadZip}}</button> <button type="button" class="btn btn-secondary" data-cancel disabled hidden>{{cancelRun}}</button></div>
    <progress data-progress max="1" aria-label="{{workingLabel}}" hidden></progress>
      <p id="batch-status" class="text-tool-note feedback" role="status" data-tool-status></p>
  </div>
</section>
